{% extends 'newsletter/base.html' %}

{% block title %}Удалить рассылку{% endblock %}

{% block content %}
<h2>Удалить рассылку</h2>
<p>Вы уверены, что хотите удалить рассылку, с сообщением "{{newsletter.message}}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Удалить</button>
    <a href="{% url 'newsletter:newsletter_list' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
